# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# JVM 参数
# 注意：这是保守配置（1GB 堆、串行执行），为资源受限环境设计。
# 普通开发机可放宽，例如：
#   org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
#   org.gradle.parallel=true
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2

# ---------------------------------------------------------------------------
# 特殊环境覆盖项（按需在本机 gradle.properties.local 中开启，勿提交）
#
# 1) 无网络环境：禁止 Gradle 自动下载 SDK 组件
#    android.builder.sdkDownload=false
#
# 2) aarch64/PRoot 等特殊平台：AGP 从 Maven 获取的 aapt2 是 x86_64 ELF，
#    会因 "AAPT2 ... Daemon startup failed" 而失败，需改用本机原生 aapt2：
#    android.aapt2FromMavenOverride=/path/to/build-tools/35.0.0/aapt2
#
# 同理，build-tools 需选用 AIDL 可执行文件与宿主架构匹配的版本
# （本项目在 app/build.gradle.kts 中固定为 35.0.0）。
#
# 本项目在 aarch64/PRoot 沙箱下的实际调用方式见 tools/build.sh。
# ---------------------------------------------------------------------------
